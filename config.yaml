- 保研名单
- 夏令营入营名单
- 优秀营员名单
crawler:
  timeout_seconds: 15
  max_workers: 8
  max_pages_per_school: 80
  max_links_per_page: 250
  min_score: 60
  request_interval_seconds: 0.25
  user_agent: 'BaoyanNoticeMonitor/1.0 (+academic admissions tracking; contact: local-user)'
search:
  provider: talor
  results_per_query: 10
  query_mode: combined
