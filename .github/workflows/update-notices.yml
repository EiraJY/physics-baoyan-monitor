name: 每日更新保研通知

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30
    # 每周一、周四运行
    - cron: "30 1 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 获取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并更新数据
        run: python crawler.py --all
        env:
          SEARCH_PROVIDER: talor
          TALOR_API_TOKEN: ${{ secrets.TALOR_API_TOKEN }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json data/notices.js data/crawl_report.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 自动更新保研通知 $(date -u +%F)"
          git push
